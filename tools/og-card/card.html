<!doctype html>
<!-- The website's social card. Render it with `node tools/og-card/render.mjs`, which writes
     site/assets/og.jpg. diff-light.webp is a crop of a real Differentialis window (light, unified). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=Geist+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Geist", sans-serif; color: #f4f2fb; position: relative;
    background:
      radial-gradient(70% 90% at 92% 0%, rgba(158,115,245,.38), transparent 62%),
      radial-gradient(60% 70% at 0% 100%, rgba(92,199,250,.16), transparent 60%),
      #0d0b16;
  }
  .copy { position: absolute; left: 68px; top: 70px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 700; letter-spacing: -0.02em; }
  .mark { position: relative; width: 46px; height: 46px; flex: none; }
  .mark i { position: absolute; width: 64%; height: 64%; border-radius: 30%; }
  .mark i:first-child { background: #f56680; left: 0; top: 12%; }
  .mark i:last-child { background: #5cc7fa; right: 0; bottom: 12%; mix-blend-mode: screen; }
  h1 { margin-top: 54px; font-size: 66px; line-height: 1.0; font-weight: 800; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #b99bff; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.38; color: #b9b4c9; font-weight: 500; }
  .url { position: absolute; left: 68px; bottom: 56px; font: 500 22px "Geist Mono", monospace; color: #b99bff; letter-spacing: 0.01em; }
  .shot {
    position: absolute; left: 640px; top: 96px; width: 650px; height: 560px;
    border-radius: 18px; overflow: hidden; background: #f6f5f9;
    box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 40px 90px -20px rgba(0,0,0,.75), 0 0 120px -30px rgba(158,115,245,.6);
    transform: rotate(-2deg);
  }
  /* Two slices of one crop: the file header, then the code, without the empty band between. */
  .shot .hdr, .shot .code { background-image: url(diff-light.webp); background-size: 780px auto; background-repeat: no-repeat; }
  .shot .hdr { height: 62px; background-position: -10px -14px; border-bottom: 1px solid #e2e0e9; }
  .shot .code { height: 498px; background-position: -10px -124px; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><span class="mark"><i></i><i></i></span>Differentialis</div>
    <h1>The free diff &amp; merge app for <em>Mac</em>.</h1>
    <p>Compare text, images, and folders. Resolve 3&#8209;way merges. Browse git history.</p>
  </div>
  <div class="url">differentialis.app</div>
  <div class="shot"><div class="hdr"></div><div class="code"></div></div>
</body></html>
